image: node:20.14.0

variables:
  GIT_DEPTH: 0

stages:
  - recycle

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/

recycle-posts:
  stage: recycle
  script:
    # Install dependencies
    - npm ci

    # Jalankan spintax (generate data/testimonials.yaml)
    - node process-spintax.js

    # Jalankan recycle (update tanggal artikel yang sudah 12 bulan)
    - node recycle-posts.js

    # Commit dan push perubahan ke GitLab
    # Cloudflare Pages akan otomatis detect push ini dan build Hugo
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git add content/ data/
    - git diff --quiet && git diff --staged --quiet || git commit -m "Auto-recycle posts [skip ci]"
    - git push origin master || echo "Tidak ada perubahan untuk di-push"

  rules:
    # Hanya jalan saat scheduled pipeline (cron harian)
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Atau saat trigger manual dari UI GitLab
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # TIDAK jalan saat push biasa (biar tidak loop dengan commit recycle)