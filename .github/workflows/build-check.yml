name: Build Check

# pagarpanel.co.id is published by Cloudflare Pages (it rebuilds on every push to master), so
# this repo does NOT build and commit public/ itself. This workflow only proves that the Hugo
# site still builds after a push — a broken template or a malformed AI article shows up here
# as a red run instead of as a failed Cloudflare deploy.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.log'
      - '.github/workflows/cleanup.yml'
  pull_request:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.124.0'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Site
        run: npm run build
