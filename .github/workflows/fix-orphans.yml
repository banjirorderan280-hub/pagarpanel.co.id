name: Fix Orphan Articles (AI)

on:
  schedule:
    # Weekly, Wednesday 12:00 UTC — away from the other scheduled workflows
    # (generate 06:00 UTC daily, revise 18:00 UTC daily, recycle Sunday 00:00 UTC).
    - cron: '0 12 * * 3'
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  fix-orphans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci` here on purpose: find-orphans.js and fix-orphans.js depend only on Node's
      # built-ins (fs, path, https) — one less thing that can break this workflow.

      - name: Find Orphan Articles (Layer 1 — fast, offline, no AI)
        run: node tools/find-orphans.js

      - name: Fix Orphans (Layer 2 — AI-assisted, staged, max 10/run)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/fix-orphans.js --apply --limit=10

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Fixes
        id: commit_push
        run: |
          # orphans.json is NOT committed — it's regenerated fresh by Layer 1 every run.
          git add content/categories/
          [ -f orphan-fixes.log ] && git add orphan-fixes.log
          [ -f .orphan-fix-progress.json ] && git add .orphan-fix-progress.json

          if git diff --staged --quiet; then
            echo "ℹ️  Nothing to commit (0 orphans fixed this session) — done."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sisipkan internal link untuk artikel yang belum ter-link (orphan fix)"

          for i in 1 2 3 4 5; do
            if git push origin master; then
              echo "✅ Push succeeded (attempt $i)."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Push still failed after 5 attempts — there may be a real conflict; check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebasing & trying again in ${wait_s}s... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin master
            git stash push -u -m "pre-rebase-autostash" || true
            git rebase origin/master
            git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deploy (publish today's link fixes now)
        if: steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Orphan fixes pushed — triggering deploy.yml so they go live now..."
          gh workflow run deploy.yml --ref master
